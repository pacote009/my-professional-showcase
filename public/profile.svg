<svg width="640" height="800" viewBox="0 0 640 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Avatar profissional de Vitor de Mello Leite</title>
  <desc id="desc">Avatar vetorial em fundo escuro com as iniciais VM e detalhes em verde.</desc>
  <rect width="640" height="800" rx="48" fill="#0B1117"/>
  <circle cx="520" cy="120" r="220" fill="url(#glow1)" opacity="0.75"/>
  <circle cx="120" cy="690" r="220" fill="url(#glow2)" opacity="0.55"/>
  <path d="M80 160H560" stroke="#1F2A35" stroke-width="2"/>
  <path d="M80 640H560" stroke="#1F2A35" stroke-width="2"/>
  <g opacity="0.32">
    <path d="M120 220H520" stroke="#2DD68F" stroke-width="1" stroke-dasharray="8 12"/>
    <path d="M120 580H520" stroke="#2DD68F" stroke-width="1" stroke-dasharray="8 12"/>
    <path d="M120 220V580" stroke="#2DD68F" stroke-width="1" stroke-dasharray="8 12"/>
    <path d="M520 220V580" stroke="#2DD68F" stroke-width="1" stroke-dasharray="8 12"/>
  </g>
  <rect x="146" y="246" width="348" height="348" rx="174" fill="#101922" stroke="#2DD68F" stroke-width="4"/>
  <rect x="178" y="278" width="284" height="284" rx="142" fill="url(#avatar)"/>
  <text x="320" y="445" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="104" font-weight="700" fill="#F2F4F3" letter-spacing="-6">VM</text>
  <rect x="215" y="500" width="210" height="34" rx="17" fill="#2DD68F" fill-opacity="0.13" stroke="#2DD68F" stroke-opacity="0.35"/>
  <text x="320" y="522" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#2DD68F">FULLSTACK · SECURITY</text>
  <g filter="url(#softShadow)">
    <rect x="118" y="660" width="404" height="66" rx="18" fill="#101922" stroke="#1F2A35"/>
    <circle cx="154" cy="693" r="9" fill="#2DD68F"/>
    <text x="178" y="699" font-family="Space Grotesk, Arial, sans-serif" font-size="18" font-weight="600" fill="#F2F4F3">Sistemas seguros em produção</text>
  </g>
  <defs>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(520 120) rotate(90) scale(220)">
      <stop stop-color="#2DD68F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2DD68F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 690) rotate(90) scale(220)">
      <stop stop-color="#00B8D9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00B8D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatar" x1="178" y1="278" x2="462" y2="562" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17212B"/>
      <stop offset="0.55" stop-color="#0F1720"/>
      <stop offset="1" stop-color="#153426"/>
    </linearGradient>
    <filter id="softShadow" x="96" y="642" width="448" height="110" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
